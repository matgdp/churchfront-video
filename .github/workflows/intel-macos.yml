name: Build Camera Tracker for Intel Mac

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intel-macos:
    runs-on: macos-15-intel
    timeout-minutes: 25
    defaults:
      run:
        working-directory: CameraTracker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Swift tests
        run: |
          test "$(uname -m)" = x86_64
          swift test
      - name: Build and verify the Intel app
        run: |
          ./build.sh
          app="dist/Camera Tracker.app"
          lipo "$app/Contents/MacOS/CameraTracker" -verify_arch x86_64
          codesign --verify --strict --verbose=2 "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" Camera-Tracker-Intel.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Camera-Tracker-Intel
          path: CameraTracker/Camera-Tracker-Intel.zip
          if-no-files-found: error
